; BSBleRemoteBridge firmware. See doc/PROTOCOL.md at the repository root for the (small) set of
; protocol deltas this firmware adds on top of BSToolbox-BLE's ble-bridge NDJSON protocol - that
; repo's CLAUDE.md and ble-bridge/src/main.rs remain the canonical wire-protocol source of truth.

[platformio]
default_envs = nanoesp32-c6
; Per-bridge OTA targets (gitignored, site-specific IPs - copy ota.local.ini.example). A glob, so
; a checkout without the file still builds.
extra_configs = ota*.local.ini

; The official platformio/platform-espressif32 registry has no Arduino-framework board manifest
; for ESP32-C6 at all (open upstream gap, tracked in platformio/platform-espressif32#1474/#1694,
; stalled on an Espressif<->PlatformIO maintainer relationship issue after Arduino-ESP32 core 3.0)
; - `platform = espressif32` + `framework = arduino` simply does not build for this chip. The
; community `pioarduino/platform-espressif32` fork is the only currently-working path to
; PlatformIO + Arduino + C6; this is a deliberate, user-approved deviation from the official
; registry, not an oversight - see CLAUDE.md's "Known risks" section. Requires PlatformIO Core
; >=6.2.0 (upgraded from 6.1.19 for this project - see CLAUDE.md).
[env:nanoesp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; Points at boards/nanoesp32_c6.json, a custom PlatformIO board profile (MCU/flash/upload metadata
; only, no pin assignments - see BoardConfig.h/include/boards/board_nanoesp32_c6.h for those).
; Written from scratch (cloned from the stock esp32-c6-devkitc-1 profile, since pioarduino has no
; nanoESP32-C6-specific entry) - flash_size=16MB, confirmed via esptool's auto-detection during a
; real upload to this board (2026-09-20), overriding the vendor docs' unverified "4MB" figure.
board = nanoesp32_c6
framework = arduino
lib_deps =
	h2zero/NimBLE-Arduino
	links2004/WebSockets
	bblanchon/ArduinoJson@^7
monitor_speed = 115200
upload_port = COM12
monitor_port = COM12
; Symbolizes a Guru Meditation crash dump's addresses against both firmware.elf and the chip's ROM
; ELF (the latter needs the platform_packages line below - `pio device monitor` auto-installs it,
; but a plain `pio run` does not) - real ROM-level crashes were what this caught during Phase 2
; bring-up (see CLAUDE.md's "Known risks"). `pio device monitor` needs a real interactive terminal;
; it will not run through a piped/non-interactive shell.
monitor_filters = esp32_exception_decoder
build_flags =
	-DBOARD_NANOESP32_C6
	-std=gnu++17
	; Project-wide include/ (BoardConfig.h etc.) isn't reliably on every private lib/*'s own
	; include path under chain LDF mode on this platform - add it explicitly rather than rely on
	; implicit behavior (bit us once already: lib/Config/Config.cpp couldn't find BoardConfig.h
	; without this, even though src/main.cpp's own #include "BoardConfig.h" worked fine).
	-Iinclude
build_unflags =
	-std=gnu++11
platform_packages = platformio/tool-esp-rom-elfs@0.0.1+20241011

; Network update of a bridge already running OTA-capable firmware (lib/Ota): same build, uploaded
; over WiFi. The password is the last 6 characters of the bridge's default name
; (ble-bridge-<last 6 MAC hex digits>, logged at boot as "[OTA] listening as ..."). Either one env
; per bridge in a gitignored ota.local.ini (see ota.local.ini.example - they show up as ordinary
; upload targets in VS Code's PlatformIO sidebar), or from a shell:
;   BLE_BRIDGE_OTA_PASSWORD=<6 hex> pio run -e nanoesp32-c6-ota -t upload --upload-port <ip>
; (<ip> or the mDNS name ble-bridge-<6 hex>.local). From Git Bash the upload step fails on
; pioarduino's "MSys/Mingw is not supported" - use PowerShell or VS Code's terminal.
[env:nanoesp32-c6-ota]
extends = env:nanoesp32-c6
upload_protocol = espota
upload_port =
upload_flags =
	--auth=${sysenv.BLE_BRIDGE_OTA_PASSWORD}

; Host-native build for the transport-independent protocol logic (HexCodec, SessionControl, the
; JSON command/response shape logic in lib/Protocol) - no ESP32 toolchain required, no NimBLE/
; WebSocket/hardware dependency. `pio test -e native`
[env:native]
platform = native
test_framework = unity
lib_deps =
	bblanchon/ArduinoJson@^7
build_flags =
	-std=c++17
